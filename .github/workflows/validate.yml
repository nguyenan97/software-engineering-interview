name: Validate curriculum

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_labs.py --check
      - run: python scripts/render_lesson_code.py --check
      - run: python labs/atomic-inbox/verify.py --solution
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: python scripts/check_site.py _site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm install --prefix work/browser-checks --no-audit --no-fund axe-core@4.10.3
      - run: python tests/browser_check.py --site _site --axe work/browser-checks/node_modules/axe-core/axe.min.js --screenshots work/screenshots
      - run: python tests/prepare_library_fixture.py --destination work/library-fixture
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./work/library-fixture
          destination: ./work/library-fixture/_site
      - run: python scripts/check_site.py work/library-fixture/_site
      - run: python tests/browser_check.py --site work/library-fixture/_site --axe work/browser-checks/node_modules/axe-core/axe.min.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-learning-ui
          path: work/screenshots
          if-no-files-found: ignore
          retention-days: 7
