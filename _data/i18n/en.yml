messages:
  bookmark_saved: Reading place saved in this browser only. Your repo agent records completion and review
    dates.
  bookmark_blocked: Browser storage is unavailable. Step and language links still work; ask your repo
    agent to save session progress.
  bookmark_cleared: Reading place cleared. Repository learning history is unchanged.
  clear_blocked: Browser storage is unavailable; no repository data was changed.
  resume: This browser saved your place at “{step}”. This is a reading bookmark, not completion.
  copied: Copied. Paste into your agent with this repository open.
  copy_blocked: Copy is unavailable. Select the prompt above and paste it into your repo agent.
  answers_closed: Answers closed. Try the three recall questions without notes.
  locale_saved: Language preference saved in this browser only. Repository state is unchanged.
  locale_blocked: Language links work, but this browser cannot save your preference. Repository state
    is unchanged.
  locale_offer: This browser remembers {language}. Open that version of this page.
  resume_fallback: Your saved lesson has no version in this language. Continue opens its English version;
    learning history is unchanged.
