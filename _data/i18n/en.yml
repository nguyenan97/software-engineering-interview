prompts:
  new:
    title: Ask for your next focused lesson
    intro: 'Open this repository in your agent and send:'
    text: Write today’s lesson in English.
    copy: Copy prompt
    status: The agent creates the lesson and saves its delivery record.
  review:
    title: Check your due reviews
    intro: 'Open this repository in your agent and send:'
    text: Review today’s due lessons in English. Ask one question at a time and wait for my attempt before
      feedback.
    copy: Copy review prompt
    status: Paste into your agent with the repo open.
  interview:
    title: Start a short mock interview
    intro: 'Open this repository in your agent and send:'
    text: Mock interview my current lesson in English. Ask one question at a time; practice 30–90-second
      answers and two deeper follow-ups. Score only dimensions supported by my answers.
    copy: Copy interview prompt
    status: Paste into your agent with the repo open.
