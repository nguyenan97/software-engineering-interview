  - number: 01 / DISCOVER
    title: Learn something new
    body: Your repo agent chooses a fresh objective from your learning history.
    label: Get the daily prompt →
  - number: 02 / CONTINUE
    title: Pick up where you left off
    body: Return to your reading place in this browser.
    label: Continue reading →
  - number: 03 / RETRIEVE
    title: Recall without notes
    body: Ask your agent what is due, then test the mechanism from memory.
    label: Start a review →
  - number: 04 / EXPLAIN
    title: Practice the interview
    body: Give a short answer, defend a failure case and discuss a trade-off.
    label: Practice speaking →
  no_bookmark: No browser reading place saved yet. Continue opens the latest lesson; ask your repo agent
    “Continue my lesson” to resume a saved coaching session.
  scope: This public desk does not read your personal learning state or write to GitHub. Browser preferences
    and bookmarks stay in this browser. Your repo agent records attempts, completion and due reviews.
  library: Your lesson library
  curriculum: Explore the curriculum →
